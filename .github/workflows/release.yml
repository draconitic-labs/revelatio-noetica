name: Release

# A v* tag builds both archives, runs each from an empty folder, and creates a draft
# release with them and SHA256SUMS. A manual run does the same up to the release, and
# leaves the archives as workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The same toolchain as ci.yml.
  RUST_TOOLCHAIN: 1.96.1
  CARGO_ABOUT_VERSION: 0.9.3

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, so the binary runs on systems with older glibc than 24.04's.
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            about-build: x86_64-unknown-linux-musl
            about-sha256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            about-build: x86_64-pc-windows-msvc
            about-sha256: 9e2942533ef1c592c4a70bdb384cae1550a3f5fc9ae40379b6662e3d2f16fe02
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windowing and Vulkan headers for the build, and lavapipe for the export check.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Name the archive
        id: names
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          echo "stem=revelatio-noetica-$version-x86_64-${{ matrix.name }}" >>"$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked

      - name: Generate the third-party licence file
        run: |
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then tmp="$(cygpath -u "$tmp")"; fi
          name="cargo-about-$CARGO_ABOUT_VERSION-${{ matrix.about-build }}"
          curl -fsSL -o "$tmp/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "${{ matrix.about-sha256 }}  $tmp/$name.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
          PATH="$tmp/$name:$PATH" cargo about generate --locked --fail \
            --config packaging/about.toml --target ${{ matrix.target }} \
            --output-file THIRD-PARTY-LICENSES.html packaging/about.hbs
          # The Hack font's licence is fixed text in about.hbs; cargo-about cannot read it.
          grep -q 'BITSTREAM VERA LICENSE' THIRD-PARTY-LICENSES.html

      - name: Package the Linux tarball
        if: runner.os == 'Linux'
        env:
          STEM: ${{ steps.names.outputs.stem }}
        run: |
          mkdir -p "dist/$STEM"
          install -m 0755 target/release/revelatio scripts/install-desktop.sh "dist/$STEM/"
          install -m 0644 \
            assets/revelatio-noetica.desktop assets/icon-256.png assets/icon.svg \
            LICENSE NOTICE assets/fonts/OFL.txt THIRD-PARTY-LICENSES.html \
            "dist/$STEM/"
          tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$STEM.tar.gz" "$STEM"
          tar -tvzf "dist/$STEM.tar.gz"

      - name: Package the Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STEM: ${{ steps.names.outputs.stem }}
        run: |
          $dir = "dist/$env:STEM"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/revelatio.exe $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item NOTICE "$dir/NOTICE.txt"
          Copy-Item assets/fonts/OFL.txt, THIRD-PARTY-LICENSES.html $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$env:STEM.zip"
          Get-ChildItem -Recurse $dir | Format-Table Length, FullName

      # The binary embeds its shaders, fonts, icon and formula images. Run it from a
      # fresh folder outside the checkout to prove nothing is read from the source tree.
      - name: Run the tarball's binary from an empty folder
        if: runner.os == 'Linux'
        env:
          STEM: ${{ steps.names.outputs.stem }}
          WGPU_BACKEND: vulkan
        run: |
          archive="$PWD/dist/$STEM.tar.gz"
          check="$(mktemp -d)"
          cd "$check"
          tar -xzf "$archive"
          ldd "$STEM/revelatio"
          "./$STEM/revelatio" --list | tee list.txt
          grep -q '^newton.fluxions ' list.txt
          "./$STEM/revelatio" --export newton.fluxions --mode 0 --size 320x180 --out exported
          test -s exported/newton_fluxions_fluent.png

      - name: Run the zip's binary from an empty folder
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STEM: ${{ steps.names.outputs.stem }}
        run: |
          $archive = Resolve-Path "dist/$env:STEM.zip"
          $check = Join-Path $env:RUNNER_TEMP "check-$env:STEM"
          New-Item -ItemType Directory $check | Out-Null
          Set-Location $check
          Expand-Archive $archive -DestinationPath .
          $exe = Join-Path $check "$env:STEM/revelatio.exe"
          & $exe --list | Tee-Object -FilePath list.txt
          if ($LASTEXITCODE -ne 0) { throw "--list exited with $LASTEXITCODE" }
          if (-not (Select-String -Quiet -Pattern '^newton\.fluxions ' list.txt)) { throw "newton.fluxions missing from --list" }
          & $exe --export newton.fluxions --mode 0 --size 320x180 --out exported
          if ($LASTEXITCODE -ne 0) { throw "--export exited with $LASTEXITCODE" }
          if (-not (Test-Path exported/newton_fluxions_fluent.png)) { throw "no exported image" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.stem }}
          path: |
            dist/${{ steps.names.outputs.stem }}.tar.gz
            dist/${{ steps.names.outputs.stem }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes "" -- *
