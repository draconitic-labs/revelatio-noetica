name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Rust release cannot fail -D warnings with no code change. Move it
  # deliberately, fixing whatever new lints appear in the same commit.
  RUST_TOOLCHAIN: 1.96.1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windowing headers for the eframe build, Vulkan headers, and the lavapipe
      # software driver so GPU tests and the export check can run.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test
        env:
          WGPU_BACKEND: vulkan

      - name: Export a still with no display
        run: ./target/release/revelatio --export newton.fluxions --mode 0 --size 320x180 --out ci-export
        env:
          WGPU_BACKEND: vulkan

      - name: Check the export exists
        run: test -s ci-export/newton_fluxions_fluent.png
