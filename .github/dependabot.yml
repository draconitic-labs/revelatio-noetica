version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      gui-stack:
        patterns:
          - egui*
          - eframe
          - epaint*
          - wgpu*
    # These crates break their APIs between minor versions and change what's drawn, so moving
    # them is a deliberate job with a look at the result. Patch releases still come through.
    ignore:
      - dependency-name: "egui*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eframe
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "epaint*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "wgpu*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: glam
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
